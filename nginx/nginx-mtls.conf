# ==============================================================================
# NGINX MUTUAL TLS (mTLS) CONFIGURATION FOR DUC'S PORTFOLIO
# ==============================================================================
# Cơ chế hoạt động:
# 1. Khách vãng lai truy cập https://ducnv.dev/ -> Duyệt web bình thường, không hỏi chứng chỉ.
# 2. Khách vào https://ducnv.dev/admin -> Nginx kiểm tra xem client có chứng chỉ số hợp lệ không.
#    - Không có chứng chỉ (hoặc chứng chỉ giả mạo): Trả về 403 Forbidden ngay lập tức
#      ở tầng mạng / SSL Handshake, chưa bao giờ chạm tới React code.
#    - Có chứng chỉ đã cài vào máy: Truy cập thẳng vào trang quản trị mượt mà.
# ==============================================================================

server {
    listen 80;
    server_name ducnv.dev admin.ducnv.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ducnv.dev admin.ducnv.dev;

    root /var/www/portfolio/dist;
    index index.html;

    # 1. Chứng chỉ SSL của Server (Domain HTTPS do Let's Encrypt hoặc Cloudflare cấp)
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # 2. CẤU HÌNH mTLS (Mutual TLS):
    # Trỏ đến file Root CA do bạn tự tạo (ca.crt)
    ssl_client_certificate /etc/nginx/certs/ca.crt;

    # "optional": Cho phép khách bình thường xem trang chủ mà KHÔNG bị chặn hay hỏi chứng chỉ.
    # Nginx sẽ kiểm tra và gán kết quả vào biến $ssl_client_verify (SUCCESS / NONE / FAILED).
    ssl_verify_client optional;
    ssl_verify_depth 2;

    # Giao thức & Bảo mật SSL tối ưu
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 3. ROUTE KHÁCH VÃNG LAI (Trang Portfolio chính)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 4. ROUTE ADMIN BẢO VỆ TUYỆT ĐỐI BẰNG mTLS
    # Bất cứ ai gõ /admin hoặc admin.ducnv.dev đều phải có chứng chỉ Client được CA ký
    location /admin {
        # Nếu chưa xuất trình chứng chỉ hoặc chứng chỉ không hợp lệ -> Trả về 404 Not Found (Stealth Guard)
        if ($ssl_client_verify != SUCCESS) {
            return 404;
        }

        # Nếu có chứng chỉ số hợp lệ -> Cho phép truy cập vào ứng dụng Admin
        try_files $uri $uri/ /index.html;
    }

    # Tối ưu cache cho tài nguyên tĩnh
    location ~* \.(glb|gltf|hdr|wasm|webp|png|jpg|jpeg|svg|css|js)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
